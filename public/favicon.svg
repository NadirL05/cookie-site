<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Cookie Cooksbrad">
  <defs>
    <linearGradient id="cookie" x1="38" y1="30" x2="91" y2="101" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f4df91"/>
      <stop offset="1" stop-color="#ceb85c"/>
    </linearGradient>
    <mask id="bite">
      <rect width="128" height="128" fill="white"/>
      <circle cx="94" cy="39" r="11" fill="black"/>
      <circle cx="103" cy="57" r="10" fill="black"/>
      <circle cx="99" cy="77" r="11" fill="black"/>
    </mask>
  </defs>

  <!-- A strong silhouette stays legible in browser tabs as small as 16 px. -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="#0c392d"/>
  <rect x="8" y="8" width="112" height="112" rx="24" fill="none" stroke="#ceb85c" stroke-width="3"/>

  <g mask="url(#bite)">
    <circle cx="62" cy="64" r="39" fill="url(#cookie)"/>
    <circle cx="62" cy="64" r="36.5" fill="none" stroke="#f7f5ef" stroke-opacity=".35" stroke-width="3"/>
  </g>

  <!-- Three oversized chips remain distinct at favicon scale. -->
  <circle cx="48" cy="47" r="6" fill="#0c392d"/>
  <circle cx="69" cy="62" r="7" fill="#0c392d"/>
  <circle cx="48" cy="80" r="5.5" fill="#0c392d"/>
  <circle cx="47" cy="45.5" r="1.6" fill="#f7f5ef" fill-opacity=".5"/>
  <circle cx="67.5" cy="60" r="1.8" fill="#f7f5ef" fill-opacity=".5"/>
</svg>
